<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI POEM GENERATOR</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>POEM GENERATOR</h1>
      </header>
      <main>
        <form id="poem-form">
          <input
            type="text"
            placeholder="Enter a topic..."
            autofocus
            required
            autocomplete="off"
            class="instruction"
          />
          <input type="submit" class="submit-button" value="Generate Poem" />
        </form>
        <div class="poem" id="poem">
          <br />
        </div>
      </main>

      <footer>
        This poem generator was coded by
        <a href="https://github.com/Shehatesssyou/">Bee </a>🤎 and is hosted on
        <a href="https://github.com/Shehatesssyou/sad-poem-generator">Github</a>
        and <a href="https://sadpoemgenerator.netlify.app/"> Netlify</a>."
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
